# Weekly version updates; security updates are enabled in repository settings.
# Minor and patch releases are grouped; major releases remain separate.
# Temporarily hold TypeScript below 7 for Angular projects; remove the ignore rule when compatible.
version: 2
updates:
- package-ecosystem: maven
  # Legacy decoder for the one-time Kryo 4 -> 5 store migration. kryo5 is updated normally.
  ignore:
  - dependency-name: com.esotericsoftware:kryo
    update-types: [version-update:semver-major]
  directory: /server
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
    timezone: Europe/Zurich
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: /client
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
    timezone: Europe/Zurich
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: typescript
    versions:
    - '>=7.0.0'
